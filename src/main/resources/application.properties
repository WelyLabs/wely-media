spring.application.name=media
server.port=8085

logging.level.root=INFO
logging.level.com.calendar.media=INFO

# spring.webflux.problemdetails.enabled is not set: GlobalErrorHandler is ordered first and answers
# every exception Boot's handler would, so enabling it would only register dead code.

# --- Callers ------------------------------------------------------------------
# One entry per business service: its secret (X-Internal-Secret), the key prefix it is confined
# to, and its bucket. A blank secret disables the client: an empty header never matches.
app.clients.users.secret=${INTERNAL_SECRET_USERS:}
app.clients.users.prefix=avatars/
app.clients.users.bucket=${AVATARS_BUCKET:wely-avatars}
app.clients.chat.secret=${INTERNAL_SECRET_CHAT:}
app.clients.chat.prefix=chat/
app.clients.chat.bucket=${CHAT_BUCKET:wely-chat-media}
app.clients.events.secret=${INTERNAL_SECRET_EVENTS:}
app.clients.events.prefix=events/
app.clients.events.bucket=${EVENTS_BUCKET:wely-event-media}
app.clients.social.secret=${INTERNAL_SECRET_SOCIAL:}
app.clients.social.prefix=communities/
app.clients.social.bucket=${COMMUNITIES_BUCKET:wely-community-media}

# --- Storage ------------------------------------------------------------------
# Garage through its S3 API. Writes use the internal Service; read URLs are signed for the public
# hostname, since a signature covers the host.
app.storage.internal-endpoint=${MEDIA_INTERNAL_ENDPOINT}
app.storage.public-endpoint=${MEDIA_PUBLIC_ENDPOINT}
app.storage.region=${MEDIA_REGION:garage}
# Empty when the key is not deployed yet: the service starts and answers MED-TEC-001 until it is.
app.storage.access-key=${MEDIA_ACCESS_KEY:}
app.storage.secret-key=${MEDIA_SECRET_KEY:}
# Keys per listing page: a page stays well under the HTTP client's 256 KB in-memory buffer.
app.storage.list-page-size=200

# A picture is held in memory, not spilled to disk: the controller refuses anything above 12 MB.
spring.webflux.multipart.max-in-memory-size=13MB

# --- Actuator -----------------------------------------------------------------
# Only health, info and prometheus are exposed: the other endpoints describe the internals.
# prometheus carries wely_errors_technical_total{code=...}; nothing scrapes it in the cluster yet.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# /actuator/health/liveness and /actuator/health/readiness for the Kubernetes probes.
management.endpoint.health.probes.enabled=true
