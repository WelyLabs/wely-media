# Development profile for local testing.
logging.level.com.calendar.media=DEBUG

# An S3-compatible storage on localhost:3900; set MEDIA_REGION to the region it signs with.
app.storage.internal-endpoint=${MEDIA_INTERNAL_ENDPOINT:http://localhost:3900}
app.storage.public-endpoint=${MEDIA_PUBLIC_ENDPOINT:http://localhost:3900}

# No secret here: export INTERNAL_SECRET_USERS / _CHAT / _EVENTS / _SOCIAL to enable a caller locally.
